# Local development stack: databases and object storage in containers, the app
# itself run with `npm run dev` on the host for fast reloads.
#
#   docker compose up -d
#   npm run db:deploy && npm run db:seed
#   npm run dev
#
# Use docker-compose.prod.yml to run the whole product in containers.

name: tetherchat-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tetherchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tetherchat}
      POSTGRES_DB: ${POSTGRES_DB:-tetherchat}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tetherchat}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tetherchat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tetherchat-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket and makes it publicly readable so
  # uploaded avatars and attachments can be served directly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-tetherchat} ${S3_SECRET_KEY:-tetherchat-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-tetherchat} &&
      mc anonymous set download local/${S3_BUCKET:-tetherchat}
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
