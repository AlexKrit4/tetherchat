# Aurora redesign mockup on port 1488 (same backend as production).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.preview.yml up -d --build web-preview

name: tetherchat

services:
  web-preview:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.preview
      args:
        VITE_API_URL: ''
        VITE_WS_URL: ''
        VITE_THEME: aurora
    restart: unless-stopped
    ports:
      - '1488:1488'
    networks:
      - default
