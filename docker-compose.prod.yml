# Production stack for tetherchat.ru.
#
#   cp .env.example .env   # then set real secrets and origins
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api node ../../node_modules/prisma/build/index.js db seed
#
# The api container applies pending migrations on every start.

name: tetherchat

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Default is HTTP so the stack boots before certificates exist.
      # After certbot, set NGINX_EDGE_CONF=./nginx/tetherchat.ru.conf
      - ${NGINX_EDGE_CONF:-./nginx/tetherchat.ru.http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/api/health']
      interval: 30s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    profiles: ['certs']
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    # Standalone issuance needs 80/443 free (stop `edge` first).
    ports:
      - '80:80'
      - '443:443'
    entrypoint: ['certbot']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty means same-origin, which is what the edge serves.
        VITE_API_URL: ''
        VITE_WS_URL: ''
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    expose:
      - '80'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-tetherchat}:${POSTGRES_PASSWORD:-tetherchat}@postgres:5432/${POSTGRES_DB:-tetherchat}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://tetherchat.ru}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-https://tetherchat.ru}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tetherchat}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tetherchat}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tetherchat-secret}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://tetherchat.ru/files}
      ENABLE_WORKERS: 'true'
      ENABLE_LINK_PREVIEWS: ${ENABLE_LINK_PREVIEWS:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@tetherchat.ru}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_APPLICATION_ID: ${FCM_APPLICATION_ID:-}
      FCM_API_KEY: ${FCM_API_KEY:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-TetherChat <no-reply@tetherchat.ru>}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tetherchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tetherchat}
      POSTGRES_DB: ${POSTGRES_DB:-tetherchat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tetherchat}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tetherchat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tetherchat-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-tetherchat} ${S3_SECRET_KEY:-tetherchat-secret}; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then echo 'minio did not become ready' >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-tetherchat};
      mc anonymous set download local/${S3_BUCKET:-tetherchat}
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
