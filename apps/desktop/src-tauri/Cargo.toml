[package]
name = "tetherchat-desktop"
version = "1.0.0"
description = "TetherChat desktop client"
authors = ["alexkrit"]
edition = "2021"

[lib]
name = "tetherchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
