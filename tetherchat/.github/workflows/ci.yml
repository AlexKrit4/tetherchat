name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://tetherchat:tetherchat@localhost:5432/tetherchat?schema=public
  TEST_DATABASE_URL: postgresql://tetherchat:tetherchat@localhost:5432/tetherchat_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
  PUBLIC_WEB_ORIGIN: http://localhost:5173
  PUBLIC_API_ORIGIN: http://localhost:4000
  ENABLE_WORKERS: 'false'
  ENABLE_LINK_PREVIEWS: 'false'
  STORAGE_DRIVER: local
  LOG_LEVEL: silent

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build --workspace @tetherchat/shared
      - run: npm run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tetherchat
          POSTGRES_PASSWORD: tetherchat
          POSTGRES_DB: tetherchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tetherchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @tetherchat/shared

      - name: Prepare databases
        run: |
          PGPASSWORD=tetherchat psql -h localhost -U tetherchat -d tetherchat \
            -c "CREATE DATABASE tetherchat_test" || true
          npm run db:deploy
          DATABASE_URL="$TEST_DATABASE_URL" npm run db:deploy

      - run: npm run test --workspace @tetherchat/shared
      - run: npm run test --workspace @tetherchat/api
      - run: npm run test --workspace @tetherchat/web

  e2e:
    name: End-to-end (desktop and mobile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tetherchat
          POSTGRES_PASSWORD: tetherchat
          POSTGRES_DB: tetherchat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tetherchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build --workspace @tetherchat/shared
      - run: npm run db:deploy

      - name: Start API and web
        run: |
          npm run dev --workspace @tetherchat/api > /tmp/api.log 2>&1 &
          npm run dev --workspace @tetherchat/web > /tmp/web.log 2>&1 &
          npx wait-on http://localhost:4000/api/health http://localhost:5173 --timeout 120000

      - run: npm run test:e2e

      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
