# Aurora redesign preview — http://tetherchat.ru:1488
# Uses the same API/files/livekit stack as production.

upstream preview_api {
  server api:4000;
  keepalive 32;
}

upstream preview_livekit {
  server livekit:7880;
  keepalive 8;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 1488;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 32m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://preview_api;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://preview_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /livekit/ {
    proxy_pass http://preview_livekit/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /files/avatars/ {
    proxy_pass http://minio:9000/tetherchat/avatars/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /files/icons/ {
    proxy_pass http://minio:9000/tetherchat/icons/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /files/wallpapers/ {
    proxy_pass http://minio:9000/tetherchat/wallpapers/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /files/ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
