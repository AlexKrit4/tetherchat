# HTTP edge used before Let's Encrypt certificates exist, and for ACME renewals.
# Serves the same routes as the TLS config so the messenger works on port 80.
#
# After certificates are issued, switch the compose mount to tetherchat.ru.conf.

upstream tetherchat_web {
  server web:80;
  keepalive 16;
}

upstream tetherchat_api {
  server api:4000;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=tetherchat_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tetherchat_auth:10m rate=1r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name tetherchat.ru www.tetherchat.ru _;

  client_max_body_size 32m;
  client_body_timeout 60s;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/auth/ {
    limit_req zone=tetherchat_auth burst=10 nodelay;
    proxy_pass http://tetherchat_api;
  }

  location /api/ {
    limit_req zone=tetherchat_api burst=60 nodelay;
    proxy_pass http://tetherchat_api;
    proxy_read_timeout 60s;
  }

  location /socket.io/ {
    proxy_pass http://tetherchat_api;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /files/ {
    proxy_pass http://minio:9000/tetherchat/;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://tetherchat_web;
  }
}
