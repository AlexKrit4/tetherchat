# Serves the built SPA inside the web container. The public edge (TLS, /api and
# /socket.io routing) is handled by nginx/tetherchat.ru.conf.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets never change, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /app/version.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /app/install.json {
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /app/tetherchat-setup.exe {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="TetherChat-setup.exe"';
    add_header Cache-Control "public, max-age=3600";
    gzip off;
    try_files $uri =404;
  }

  location = /app/tetherchat.AppImage {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="TetherChat.AppImage"';
    add_header Cache-Control "public, max-age=3600";
    gzip off;
    try_files $uri =404;
  }

  location = /app/tetherchat.deb {
    default_type application/vnd.debian.binary-package;
    add_header Content-Disposition 'attachment; filename="TetherChat.deb"';
    add_header Cache-Control "public, max-age=3600";
    gzip off;
    try_files $uri =404;
  }

  location = /app/tetherchat.apk {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="TetherChat.apk"';
    add_header Cache-Control "public, max-age=3600";
    gzip off;
    try_files $uri =404;
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # The service worker and manifest must always be revalidated, otherwise a
  # stale worker keeps serving an old app shell.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # Client-side routes such as /channels/:serverId/:channelId resolve to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;
}
