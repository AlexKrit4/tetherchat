# Public edge for tetherchat.ru.
#
# Mount this at /etc/nginx/conf.d/tetherchat.ru.conf in the edge container and
# issue certificates with:
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
#     --webroot -w /var/www/certbot -d tetherchat.ru -d www.tetherchat.ru

upstream tetherchat_web {
  server web:80;
  keepalive 16;
}

upstream tetherchat_api {
  server api:4000;
  keepalive 32;
}

# Rate limit buckets. The API enforces its own per-user limits; this only keeps a
# single IP from exhausting worker connections.
limit_req_zone $binary_remote_addr zone=tetherchat_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tetherchat_auth:10m rate=1r/s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name tetherchat.ru www.tetherchat.ru;

  # ACME challenges must stay on plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://tetherchat.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.tetherchat.ru;

  ssl_certificate     /etc/letsencrypt/live/tetherchat.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tetherchat.ru/privkey.pem;

  return 301 https://tetherchat.ru$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name tetherchat.ru;

  ssl_certificate     /etc/letsencrypt/live/tetherchat.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tetherchat.ru/privkey.pem;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Attachments are capped at 10 MB by the API; leave headroom for the envelope.
  client_max_body_size 12m;
  client_body_timeout 60s;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Docker embedded DNS — lets nginx resolve service names that start after edge.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/auth/ {
    limit_req zone=tetherchat_auth burst=10 nodelay;
    proxy_pass http://tetherchat_api;
  }

  location /api/ {
    limit_req zone=tetherchat_api burst=60 nodelay;
    proxy_pass http://tetherchat_api;
    proxy_read_timeout 60s;
  }

  # WebSocket transport: needs the upgrade headers and a long read timeout so an
  # idle connection is not cut between socket.io pings.
  location /socket.io/ {
    proxy_pass http://tetherchat_api;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # LiveKit signaling (WebRTC media uses UDP directly to the host).
  location /livekit/ {
    rewrite ^/livekit/(.*)$ /$1 break;
    set $livekit_upstream http://livekit:7880;
    proxy_pass $livekit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Uploads. STORAGE_DRIVER=s3 serves them from MinIO; with the local driver
  # point this at the API instead (proxy_pass http://tetherchat_api).
  location /files/ {
    proxy_pass http://minio:9000/tetherchat/;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://tetherchat_web;
  }
}
