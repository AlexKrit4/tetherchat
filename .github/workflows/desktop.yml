name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build -w @tetherchat/shared
      - run: npm run build -w @tetherchat/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: tetherchat-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    name: Windows setup exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build -w @tetherchat/shared
      - run: npm run build -w @tetherchat/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: tetherchat-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
