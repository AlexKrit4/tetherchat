port: 7880
bind_addresses:
  - ''

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

redis:
  address: redis:6379

keys:
  # Overridden at runtime via LIVEKIT_KEYS env (key: secret pairs).

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 2

turn:
  enabled: false
